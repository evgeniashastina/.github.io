<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Films – Evgenia Shastina</title>

    <style>
        /* ======================== */
        /* GENERAL STYLES & LAYOUT  */
        /* ======================== */
        
        @font-face {
        font-family: Body;
        src: url('fonts/Bigbelow-gw60p.otf');
        font-size: 30px;
        font-weight: bold;
    }
    @font-face {
        font-family: Describtion;
        src: url('fonts/MarseilleFreeRegular-rvKW8.otf');
        font-size: 30px;
        font-weight: bold;
    }
        body {
            font-family: 'Body', sans-serif;
            background: #d6e4e7;
            margin: 0;
            font-size: 30px;
            color:#ff9956;
        }

        #container {
            width: 100%;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1;
            padding: 40px 20px; /* Gives space around the edges */
        }
        footer {
        font-family: 'Body';
        position: relative;
        z-index: 2;
        background-color: #d6e4e7;
        width: 100%;
        height: 40px;
        padding: 10px;
        text-align: center;
        color: #ff9956;
        font-size: medium;
    }

        h1 {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 50px;
            letter-spacing: 2px;
        }

        /* ======================== */
        /* NAVBAR                   */
        /* ======================== */
        #headerArea {
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        #navbar {
            height: 50px;
            background-color: #d6e4e7;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #burger-btn {
            display: none;
        }

        #mobile-dropdown {
            display: none;
        }

        #nav-menu {
            display: flex;
            list-style: none;
            justify-content: space-evenly;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        #nav-menu li a img {
            display: block;
            max-height: 32px;
            border: none;
            transition: transform 0.2s ease;
        }

        #nav-menu li a img:hover {
            transform: scale(1.08);
        }

        /* ======================== */
        /* FILM CARDS               */
        /* ======================== */
        .corner img{
            position: absolute;
    z-index: -1;
    margin-top: auto;
    margin-left: auto;
    width: auto;
    max-width: 25%;   
            top: 0;
            right: 0;
        }
        .programme {
            max-width: 1200px;
            margin: auto;
            display: grid;
            /* Adjusts automatically based on screen size */
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 40px;
        }

        .film-card {
            background: white;
            overflow: hidden;
            border-radius: 10px; /* slightly rounded corners */
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .film-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .film-card a {
            text-decoration: none;
            color: inherit;
            font-family: 'Describtion';
            font-size: 16px;
        }

        .film-card img {
            width: 100%;
            height: 450px;
            object-fit: cover;
            display: block;
        }

        .content {
            padding: 20px;
        }

        .content h2 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
        }

        .content p {
            line-height: 1.6;
            color: #555;
            margin: 0;
        }

        /* ============================================= */
        /* MOBILE ONLY STYLES                            */
        /* ============================================= */
        @media only screen and (max-width: 800px) {
            main { padding: 40px 20px; }
            
            /* Make padding smaller on phones */
            .corner img{
            position: absolute;
    z-index: -1;
    margin-top: auto;
    margin-right: auto;
    width: auto;
    max-width: 30%;   
            top: 30px;
            right: 10px;
        }
           
            /* Stack cards in one single column on phones */
            .programme {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            /* Make images shorter on phones so they don't take up the whole screen */
            .film-card img {
                height: 280px;
            }

            /* Navbar styling for phones */
            #navbar {
                 height: 50px;
            justify-content: flex-end;
            margin-right: 50%;
            margin-left: auto;
            padding: 2 2px;
                
            }
            #nav-menu {
                display: none;
            }
            #burger-btn {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                width: 28px;
                height: 20px;
                background: none;
                border: none;
                cursor: pointer;
                padding: 0;
                z-index: 1100;
                margin-right: 20px;
            }
            #burger-btn span {
                display: block;
                width: 100%;
                height: 3px;
                background-color: #ff9956;
                border-radius: 3px;
                transition: transform 0.3s ease, opacity 0.3s ease;
            }
            #burger-btn.open span:nth-child(1) {
                transform: translateY(8.5px) rotate(45deg);
            }
            #burger-btn.open span:nth-child(2) {
                opacity: 0;
            }
            #burger-btn.open span:nth-child(3) {
                transform: translateY(-8.5px) rotate(-45deg);
            }

            /* Mobile Dropdown Menu */
            #mobile-dropdown {
                display: block;
                position: absolute;
                top: 50px;
                right: 0;
                width: 220px;
                background-color: rgba(255, 255, 255, 0.801);
                z-index: 1050;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.35s ease, padding 0.35s ease;
                
            }
            #mobile-dropdown.open {
                max-height: 500px;
                padding: 15px 0;
            }
            #mobile-dropdown ul {
                list-style: none;
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
            #mobile-dropdown li {
                width: 80%;
                display: flex;
                justify-content: center;
            }
            #mobile-dropdown li a img {
                max-width: 100%;
                max-height: 30px;
                height: auto;
                margin: 0 auto;
            }
            footer {
                font-size: 40%;
            margin-top: auto;
        }
        }
    </style>
</head>
<body>

<div id="container">
    
    <!-- NAVBAR -->
    <div id="headerArea">
        <nav id="navbar">
            <button id="burger-btn" aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            
            <ul id="nav-menu">
                <li><a href="index.html"><img src="images/home_button.PNG" alt="Home"></a></li>
                <li><a href="myFilms.html"><img src="images/MyFilms_button.PNG" alt="My Films"></a></li>
                <li><a href="portfolio.html"><img src="images/Portfolio_button.PNG" alt="Portfolio"></a></li>
                <li><a href="lifeDrawings.html"><img src="images/LifeDrawings_button.PNG" alt="Life Drawings"></a></li>
                <li><a href="experience.html"><img src="images/Experience_button.PNG" alt="Experience"></a></li>
                <li><a href="contact.html"><img src="images/Contact_button.PNG" alt="Contact"></a></li>
            </ul>
            
            <div id="mobile-dropdown">
                <ul>
                    <li><a href="index.html"><img src="images/home_button.PNG" alt="Home"></a></li>
                    <li><a href="myFilms.html"><img src="images/MyFilms_button.PNG" alt="My Films"></a></li>
                    <li><a href="portfolio.html"><img src="images/Portfolio_button.PNG" alt="Portfolio"></a></li>
                    <li><a href="lifeDrawings.html"><img src="images/LifeDrawings_button.PNG" alt="Life Drawings"></a></li>
                    <li><a href="experience.html"><img src="images/Experience_button.PNG" alt="Experience"></a></li>
                    <li><a href="contact.html"><img src="images/Contact_button.PNG" alt="Contact"></a></li>
                </ul>
            </div>
        </nav>
    </div>

    <!-- MAIN CONTENT -->
    <main>
        <h1>MY FILMS</h1>
        <div class="corner img">
            <img src="images/MyFilms/Zhenya Class Photo.PNG" alt="">
        </div>

        <div class="programme">
            <div class="film-card">
                <a href="film1.html">
                    <img src="images/MyFilms/Kupala poster.png" alt="">
                    <div class="content">
                        <h2>Kupala Night</h2>
                        <p>A young girl is about to get unwillingly married. During the Kupala Festival she finds her own freedom.</p>
                    </div>
                </a>
            </div>

            <div class="film-card">
                <a href="film2.html">
                    <img src="images/MyFilms/shot0.png" alt="">
                    <div class="content">
                        <h2>Homesick</h2>
                        <p>Story following a teenage girl, escaping her home and trying to find a new one.</p>
                    </div>
                </a>
            </div>
        </div>
    </main>
    </div>
    <footer id="footer">Evgenia Shastina, All Rights Reserved, 2026</footer>

</div>

<!-- JAVASCRIPT -->
<script>
    /* Burger menu toggle */
    const burgerBtn = document.getElementById('burger-btn');
    const mobileDropdown = document.getElementById('mobile-dropdown');
    
    burgerBtn.addEventListener('click', function() {
        burgerBtn.classList.toggle('open');
        mobileDropdown.classList.toggle('open');
    });
    
    mobileDropdown.querySelectorAll('a').forEach(function(link) {
        link.addEventListener('click', function() {
            burgerBtn.classList.remove('open');
            mobileDropdown.classList.remove('open');
        });
    });
</script>

</body>
</html>
