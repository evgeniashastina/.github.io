<!-- JAVASCRIPT -->
<script>
    /* Burger menu toggle */
    const burgerBtn = document.getElementById('burger-btn');
    const mobileDropdown = document.getElementById('mobile-dropdown');
    burgerBtn.addEventListener('click', function() {
        burgerBtn.classList.toggle('open');
        mobileDropdown.classList.toggle('open');
    });
    mobileDropdown.querySelectorAll('a').forEach(function(link) {
        link.addEventListener('click', function() {
            burgerBtn.classList.remove('open');
            mobileDropdown.classList.remove('open');
        });
    });
    /* Hover slideshow for each gallery card */
    document.querySelectorAll('.gallery-card').forEach(function(card) {
        /* Read the list of images from the data-images attribute */
        const images = card.getAttribute('data-images').split(',');
        const img = card.querySelector('.card-img');
        let currentIndex = 0;
        let slideshowInterval = null;
        /* When mouse enters the card, start cycling through images */
        card.addEventListener('mouseenter', function() {
            if (images.length < 2) return; /* Only slide if there are multiple images */
            slideshowInterval = setInterval(function() {
                currentIndex = (currentIndex + 1) % images.length;
                img.style.opacity = '0'; /* Fade out */
                setTimeout(function() {
                    img.src = images[currentIndex].trim();
                    img.style.opacity = '1'; /* Fade in */
                }, 200);
            }, 900); /* Changes image every 900ms */
        });
        /* When mouse leaves the card, stop slideshow and reset to first image */
        card.addEventListener('mouseleave', function() {
            clearInterval(slideshowInterval);
            currentIndex = 0;
            img.style.opacity = '0';
            setTimeout(function() {
                img.src = images[0].trim();
                img.style.opacity = '1';
            }, 200);
        });
    });
</script>

    .gallery-card {

        display: flex;
        flex-direction: column;
        cursor: pointer;
    }
    /* The image box */
    .card-image-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 3; /* Makes all cards the same proportional height */
        overflow: hidden;
        border-radius: 10px;
        border: 2px solid hsl(0, 0%, 100%);
        box-shadow: 0 6px 25px rgba(255, 255, 255, 0.3);
        background-color: #ffffff;
    }
    /* The image inside the card */

        width: 100%;
        height: 100%;
        object-fit: cover;         /* Fills the box without stretching */
        display: block;
        transition: opacity 0.2s ease, transform 0.4s ease;
    }

    }

        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;

        border-radius: 8px;
