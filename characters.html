<!-- 
    LIGHTBOX MODAL
    ===============
    This appears when you click an image.
    You do not need to edit this part.
-->
<div id="lightbox" class="hidden">
    <div id="lightbox-box">
        <!-- Close button -->
        <button id="lightbox-close" aria-label="Close">✕</button>
        <!-- Left: full image -->
        <div id="lightbox-img-side">
            <img id="lightbox-img" src="" alt="">
        </div>
        <!-- Right: description panel -->
        <div id="lightbox-info-side">
            <h2 id="lightbox-title"></h2>
            <p id="lightbox-desc"></p>
        </div>
    </div>
    <!-- Dark backdrop, click it to close -->
    <div id="lightbox-backdrop"></div>
</div>
<!-- JAVASCRIPT -->
<script>
    /* ---- Burger menu ---- */
    const burgerBtn = document.getElementById('burger-btn');
    const mobileDropdown = document.getElementById('mobile-dropdown');
    burgerBtn.addEventListener('click', function() {
        burgerBtn.classList.toggle('open');
        mobileDropdown.classList.toggle('open');
    });
    mobileDropdown.querySelectorAll('a').forEach(function(link) {
        link.addEventListener('click', function() {
            burgerBtn.classList.remove('open');
            mobileDropdown.classList.remove('open');
        });
    });
    /* ---- Lightbox ---- */
    const lightbox       = document.getElementById('lightbox');
    const lightboxImg    = document.getElementById('lightbox-img');
    const lightboxTitle  = document.getElementById('lightbox-title');
    const lightboxDesc   = document.getElementById('lightbox-desc');
    const lightboxClose  = document.getElementById('lightbox-close');
    const lightboxBack   = document.getElementById('lightbox-backdrop');
    /* Open lightbox when a gallery item is clicked */
    document.querySelectorAll('.gallery-item').forEach(function(item) {
        item.addEventListener('click', function() {
            const src   = item.getAttribute('data-src');
            const desc  = item.getAttribute('data-desc');
            const title = item.querySelector('.img-title').textContent;
            lightboxImg.src      = src;
            lightboxTitle.textContent = title;
            lightboxDesc.textContent  = desc;
            lightbox.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; /* Prevent page scroll while open */
        });
    });
    /* Close lightbox */
    function closeLightbox() {
        lightbox.classList.add('hidden');
        lightboxImg.src = '';
        document.body.style.overflow = '';
    }
    lightboxClose.addEventListener('click', closeLightbox);
    lightboxBack.addEventListener('click', closeLightbox);
    /* Close with Escape key */
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeLightbox();
    });
</script>
<!-- CSS -->
<style>

    /* ===================== */

    /* ===================== */
    main {

        padding: 50px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    #gallery-title {
        text-align: center;
        margin-bottom: 45px;
        width: 100%;
    }
    #back-link {
        display: inline-block;
        margin-bottom: 15px;
        color: #ED64F5;
        font-weight: bold;
        text-decoration: none;
        font-size: 14px;
        transition: opacity 0.2s;
    }
    #back-link:hover {
        opacity: 0.7;
    }
    #gallery-title h1 {
        font-size: 42px;
        color: #ED64F5;
        letter-spacing: 2px;
        margin-bottom: 8px;
    }
    #gallery-title p {
        font-size: 14px;
        color: #d8b4fe;
    }
    /* ===================== */
    /* MASONRY GALLERY       */
    /* ===================== */
    #masonry-gallery {
        /* CSS columns create the masonry effect automatically.
           Each image drops into the shortest column, 
           preserving its original proportions. */
        column-count: 3;       /* 3 columns on desktop */
        column-gap: 20px;
        width: 100%;
        max-width: 1300px;
    }
    /* Each gallery item */
    .gallery-item {
        break-inside: avoid;   /* Prevents an image from being split across columns */
        margin-bottom: 20px;
        cursor: pointer;
        position: relative;
        border-radius: 8px;
        overflow: hidden;
        border: 2px solid transparent;
        transition: border-color 0.3s ease, transform 0.3s ease;
        background-color: #241445;
    }
    .gallery-item:hover {
        border-color: #ED64F5;
        transform: translateY(-4px); /* Lifts the card slightly on hover */
        box-shadow: 0 10px 30px rgba(237, 100, 245, 0.3);
    }
    /* The image itself - keeps its original dimensions */
    .gallery-item img {
        width: 100%;         /* Fills the column width */
        height: auto;        /* Height adjusts automatically, keeping original ratio */
        display: block;
        transition: opacity 0.3s ease;
    }
    .gallery-item:hover img {
        opacity: 0.85;
    }
    /* Title shown below each image */
    .img-title {
        padding: 10px 12px;
        font-size: 13px;
        color: #d8b4fe;
        text-align: left;
        background-color: #1a0a3a;
    }
    /* ===================== */
    /* LIGHTBOX              */
    /* ===================== */
    /* Dark background overlay */
    #lightbox {
        position: fixed;
        top: 0; left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    /* Hidden state */
    #lightbox.hidden {
        display: none;
    }
    /* Clickable dark backdrop */
    #lightbox-backdrop {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-color: rgba(8, 3, 26, 0.88);
    }
    /* The main lightbox box (70% of screen) */
    #lightbox-box {
        position: relative;
        z-index: 1;
        width: 70vw;         /* 70% of screen width */
        max-height: 85vh;    /* Max 85% of screen height */
        background-color: #13092D;
        border: 2px solid #ED64F5;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(237, 100, 245, 0.4);
        display: flex;       /* Side-by-side: image left, description right */
        overflow: hidden;
    }
    /* Close button */
    #lightbox-close {
        position: absolute;
        top: 12px;
        right: 15px;
        background: none;
        border: none;
        color: #ED64F5;
        font-size: 22px;
        cursor: pointer;
        z-index: 10;
        transition: transform 0.2s ease;
        line-height: 1;
    }
    #lightbox-close:hover {
        transform: scale(1.2);
    }
    /* LEFT SIDE: image */
    #lightbox-img-side {
        flex: 1;                 /* Takes up most of the space */
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: #08031A;
        min-width: 0;
    }
    #lightbox-img {
        max-width: 100%;
        max-height: 85vh;
        object-fit: contain;     /* Shows image in full, no cropping */
        display: block;
    }
    /* RIGHT SIDE: description panel */
    #lightbox-info-side {
        width: 240px;            /* Fixed width description column */
        min-width: 240px;
        padding: 50px 22px 25px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        overflow-y: auto;        /* Scrollable if description is very long */
        border-left: 1px solid rgba(237, 100, 245, 0.3);
    }
    #lightbox-title {
        color: #ED64F5;
        font-size: 20px;
        line-height: 1.3;
    }
    #lightbox-desc {
        color: #d8b4fe;
        font-size: 14px;
        line-height: 1.7;
    }
    /* ===================== */
    /* FOOTER                */
    /* ===================== */
    footer {
        background-color: #ffffff;
        width: 100%;
        height: 40px;
        padding: 10px;
        text-align: center;
        color: #13092D;
        margin-top: auto;
    }
    /* ============================================= */
    /* MOBILE ONLY                                   */
    /* ============================================= */
    @media only screen and (max-width: 800px) {
        #navbar {
            justify-content: flex-end;
            padding: 0 15px;
        }
        #nav-menu { display: none; }
        #burger-btn {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 28px;
            height: 20px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 1100;
        }
        #burger-btn span {
            display: block;
            width: 100%;
            height: 3px;
            background-color: #ED64F5;
            border-radius: 3px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        #burger-btn.open span:nth-child(1) { transform: translateY(8.5px) rotate(45deg); }
        #burger-btn.open span:nth-child(2) { opacity: 0; }
        #burger-btn.open span:nth-child(3) { transform: translateY(-8.5px) rotate(-45deg); }
        #mobile-dropdown {
            display: block;
            position: absolute;

            width: 220px;
            background-color: rgba(19, 9, 45, 0.97);
            border-left: 2px solid #ED64F5;
            border-bottom: 2px solid #ED64F5;
            border-radius: 0 0 0 10px;
            z-index: 1050;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, padding 0.35s ease;
        }
        #mobile-dropdown.open {
            max-height: 500px;
            padding: 10px 0;
        }

            list-style: none;
            margin: 0; padding: 0;

            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #mobile-dropdown li a img { max-width: 100%; max-height: 30px; height: auto; margin: 0 auto; }
        /* 1 column on phones (images stack in a single list) */
        #masonry-gallery {
            column-count: 1;
        }
        main {
            padding: 25px 12px;
        }
        #gallery-title h1 {

        #lightbox-box {
