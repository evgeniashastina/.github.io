<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio – Evgenia Shastina</title>

    <style>
        /* ======================== */
        /* GENERAL STYLES           */
        /* ======================== */
        @font-face {
        font-family: Nunito;
        src: url('fonts/MarseilleFreeRegular-rvKW8.otf');
    }
        @font-face {
        font-family: Footer;
        src: url('fonts/Bigbelow-gw60p.otf');
        font-weight: bold;
    }
        body {
            font-family: 'Nunito';
            margin: 0;
            background: #fbffe6ee; /* Clean, minimalistic off-white */
            color: #bf2b2b;
        }

        #container {
            width: 100%;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ======================== */
        /* NAVBAR                   */
        /* ======================== */
        #headerArea {
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        #navbar {
            height: 50px;
            background-color: #fbffe6ee;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative; 
        }

        #burger-btn { display: none; }
        #mobile-dropdown { display: none; }

        #nav-menu {
            display: flex;
            padding: 0;
            margin: 0;
            list-style-type: none;
            justify-content: space-evenly;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        #nav-menu li a { text-decoration: none; }
        #nav-menu li a img {
            display: block;
            border: none;
            max-height: 32px;
            transition: transform 0.2s ease;
        }
        #nav-menu li a img:hover { transform: scale(1.08); }

        /* ======================== */
        /* LIST BLOCKS LAYOUT       */
        /* ======================== */
        main {
            flex: 1;
            padding: 60px 30px;
            max-width: 1500px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .page-title {
            text-align: center;
            font-size: 36px;
            margin-top: 0;
            margin-bottom: 50px;
            letter-spacing: 2px;
            color: #bf2b2b;
        }

        .list-block {
            display: flex;
            gap: 60px; /* Space between images and text */
            margin-bottom: 120px; /* Lots of minimalistic white space between blocks */
            align-items: center; /* Centers the text vertically with the images */
        }

        /* --- Left Side: Images --- */

            .block-images {
    flex: 2;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
     align-content: start;
    }

        

        .gallery-img {
            width: 100%;
            height: auto; 
            display: block;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-img:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        /* --- Right Side: Text (WITH HAND DRAWN BACKGROUND) --- */
        .block-text {
            flex: 0.8; 
            background-image: url('images/experience/Text_box.png'); /* The hand drawn outline image */
            background-size: 100% 100%; /* Stretches exactly to the text size */
            background-repeat: no-repeat;
            background-position: center;
            padding: 50px 40px; /* Space inside the box so text doesn't touch the drawn borders */
        }

        .block-text h2 {
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 20px;
            color: #222;
            letter-spacing: 1px;
        }

        .block-text p {
            font-size: 17px;
            line-height: 1.8;
            color: #555;
            margin-bottom: 15px;
        }

        /* ======================== */
        /* LIGHTBOX / POPUP         */
        /* ======================== */
        #lightbox {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.9);
    z-index: 9999;
}

#lightbox.hidden{
    display:none;
}

#lightbox-content{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100vw;
    height:100dvh; /* use dynamic viewport */
    position:relative;
}

#lightbox-img{
    display:block;
    max-width:95vw;
    max-height:95dvh;
    width:auto;
    height:auto;
    object-fit:contain;
}

        .nav-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.15); color: white; border: none;
            font-size: 30px; padding: 15px 25px; cursor: pointer;
            z-index: 3; border-radius: 8px; transition: background 0.2s ease;
        }
        .nav-arrow:hover { background: rgba(255,255,255,0.4); }
        #lightbox-prev { left: 20px; }
        #lightbox-next { right: 20px; }
        
        #lightbox-close {
            position: absolute; top: 20px; right: 25px;
            background: transparent; color: white; border: none;
            font-size: 35px; cursor: pointer; z-index: 3;
            transition: transform 0.2s ease;
        }
        #lightbox-close:hover { transform: scale(1.2); }

        footer {
        font-family: 'Footer';
        position: relative;
        z-index: 2;
        background-color: #fbffe6ee;
        width: 100%;
        height: 40px;
        padding: 10px;
        text-align: center;
        color: #ff9956;
        font-size: medium;
    }

        /* ============================================= */
        /* MOBILE ONLY STYLES                            */
        /* ============================================= */
        @media only screen and (max-width: 800px) {
            main { padding: 40px 20px; }
            
            /* Stacks the text under the images on phones */
            .list-block {
                flex-direction: column;
                gap: 30px;
                margin-bottom: 80px;
                margin-right: auto;
                margin-left: auto;
            }

            /* Creates a horizontal swipeable gallery for multiple images on phone */
            .block-images{
    display:flex;
    flex-direction:row;
    overflow-x:auto;
    gap:15px;
}

.gallery-img{
    flex:0 0 85%;
    height:260px;
}

            /* If there is only ONE image, make it take 100% width on phone */
            .gallery-img:only-child {
                flex: 0 0 100%;
            }

            /* Box padding is slightly smaller on phones so it fits nicely */
            .block-text {
                padding: 40px 25px;
            }

            .block-text h2 { font-size: 26px; }
            .block-text p { font-size: 16px; }
            
            .nav-arrow { padding: 10px 15px; font-size: 24px; }
            #lightbox-prev { left: 10px; }
            #lightbox-next { right: 10px; }
            #lightbox-img { max-width: 100%; max-height: 80%; border-radius: 0;}
            #lightbox-close { top: 10px; right: 15px; }

            /* Navbar mobile */
            #navbar { justify-content: flex-end; padding: 0 15px;
            position: absolute;
            }
            #nav-menu { display: none; }
            #burger-btn {
                display: flex; flex-direction: column; justify-content: space-between;
                width: 28px; height: 20px; background: none; border: none;
                cursor: pointer; padding: 0; margin-right: 25px; z-index: 1100;
            }
            #burger-btn span {
                display: block; width: 100%; height: 3px; background-color: #ff9956;
                border-radius: 3px; transition: transform 0.3s ease, opacity 0.3s ease;
            }
            #burger-btn.open span:nth-child(1) { transform: translateY(8.5px) rotate(45deg); }
            #burger-btn.open span:nth-child(2) { opacity: 0; }
            #burger-btn.open span:nth-child(3) { transform: translateY(-8.5px) rotate(-45deg); }
            #mobile-dropdown {
                display: block; position: absolute; top: 50px; right: 0; width: 220px;
                background-color: rgba(253, 253, 253, 0.98); z-index: 1050;
                max-height: 0; overflow: hidden; transition: max-height 0.35s ease, padding 0.35s ease;
                box-shadow: -4px 4px 15px rgba(0,0,0,0.1);
            }
            #mobile-dropdown.open { max-height: 500px; padding: 15px 0; }
            #mobile-dropdown ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 15px; }
            #mobile-dropdown li { width: 80%; display: flex; justify-content: center; }
            #mobile-dropdown li a img { max-width: 100%; max-height: 30px; height: auto; margin: 0 auto; }
        }
        footer {
            font-size: 80%;
            margin-top: auto;
        }
    </style>
</head>
<body>

<!-- ========================================== -->
<!-- LIGHTBOX                                   -->
<!-- ========================================== -->
<div id="lightbox" class="hidden">
    <div id="lightbox-backdrop"></div>
    <button id="lightbox-close" aria-label="Close">✕</button>
    <button id="lightbox-prev" class="nav-arrow">❮</button>
    <div id="lightbox-content">
        <img id="lightbox-img" src="" alt="Fullscreen view">
    </div>
    <button id="lightbox-next" class="nav-arrow">❯</button>
</div>

<!-- ========================================== -->
<!-- JAVASCRIPT                                 -->
<!-- ========================================== -->
<script>
    // 1. Navbar Logic
    const burgerBtn = document.getElementById('burger-btn');
    const mobileDropdown = document.getElementById('mobile-dropdown');
    burgerBtn.addEventListener('click', function() {
        burgerBtn.classList.toggle('open');
        mobileDropdown.classList.toggle('open');
    });
    mobileDropdown.querySelectorAll('a').forEach(function(link) {
        link.addEventListener('click', function() {
            burgerBtn.classList.remove('open');
            mobileDropdown.classList.remove('open');
        });
    });

    // 2. Lightbox Logic
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    let currentGalleryImages = [];
    let currentIndex = 0;

    // Open lightbox when clicking an image
    document.body.addEventListener('click', (e) => {
        if (e.target.classList.contains('gallery-img')) {
            // Find which specific block we clicked inside
            const parentBlock = e.target.closest('.block-images');
            
            // Get only the images from THAT specific block
            currentGalleryImages = Array.from(parentBlock.querySelectorAll('.gallery-img'));
            
            // Find the index of the exact image we clicked
            currentIndex = currentGalleryImages.indexOf(e.target);
            
            if (currentIndex !== -1) {
                showLightboxImage();
                lightbox.classList.remove('hidden');
                document.body.style.overflow = 'hidden'; // Stop background page from scrolling
            }
        }
    });

    function showLightboxImage() {
        if (currentGalleryImages.length > 0) {
            lightboxImg.src = currentGalleryImages[currentIndex].src;
        }
    }

    function closeLightbox() {
        lightbox.classList.add('hidden');
        document.body.style.overflow = ''; 
        lightboxImg.src = '';
    }

    function nextImage() {
        if (currentGalleryImages.length > 0) {
            currentIndex = (currentIndex + 1) % currentGalleryImages.length;
            showLightboxImage();
        }
    }

    function prevImage() {
        if (currentGalleryImages.length > 0) {
            currentIndex = (currentIndex - 1 + currentGalleryImages.length) % currentGalleryImages.length;
            showLightboxImage();
        }
    }

    // Button event listeners
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.getElementById('lightbox-backdrop').addEventListener('click', closeLightbox);
    document.getElementById('lightbox-next').addEventListener('click', nextImage);
    document.getElementById('lightbox-prev').addEventListener('click', prevImage);

    // Keyboard support
    document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('hidden')) {
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'ArrowLeft') prevImage();
        }
    });
</script>
</body>
