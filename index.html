<!-- JavaScript for blur effect and burger menu toggle -->
<script>
    /* Header blur on scroll */
    window.addEventListener('scroll', function() {
        const scrollY = window.scrollY;
        const header = document.getElementById('header');
        const blurValue = Math.min(scrollY / 25, 10);
        const scaleValue = 1 + (blurValue / 200); 
        header.style.setProperty('--blur-amount', blurValue + 'px');
        header.style.setProperty('--scale-amount', scaleValue);
    });

    /* Burger menu toggle */
    const burgerBtn = document.getElementById('burger-btn');
    const navMenu = document.getElementById('nav-menu');

    burgerBtn.addEventListener('click', function() {
        /* Toggle open/closed classes on both the button and menu */
        burgerBtn.classList.toggle('open');
        navMenu.classList.toggle('open');
    });

    /* Close menu when any nav link is clicked */
    navMenu.querySelectorAll('a').forEach(function(link) {
        link.addEventListener('click', function() {
            burgerBtn.classList.remove('open');
            navMenu.classList.remove('open');
        });
    });
</script>

            background: none;
            border: none;
            cursor: pointer;
            padding: 0;

        /* The three burger lines */
        #burger-btn span {
            display: block;
            width: 100%;
            height: 3px;
            background-color: #ED64F5; /* Purple lines to match your theme */
            border-radius: 3px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        /* Burger animation: top line rotates down */
        #burger-btn.open span:nth-child(1) {
            transform: translateY(9.5px) rotate(45deg);
        }

        /* Burger animation: middle line fades out */
        #burger-btn.open span:nth-child(2) {
