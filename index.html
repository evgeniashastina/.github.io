<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evgenia Shastina</title>
</head>
<body>
    <div id="container">
    <!-- The header in the background -->
    <div id="header"></div>
    
    <!-- The navbar wrapper that becomes sticky -->
    <div id="headerArea">
        <nav id="navbar">
            <!-- Burger button (only shows on mobile) -->
            <button id="burger-btn" aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <!-- Desktop nav links (hidden on mobile) -->
            <ul id="nav-menu">
                <li><a href="#"><img src="images/home_button.PNG" alt="Home"></a></li>
                <li><a href="#"><img src="images/MyFilms_button.PNG" alt="My Films"></a></li>
                <li><a href="#"><img src="images/Portfolio_button.PNG" alt="Portfolio"></a></li>
                <li><a href="#"><img src="images/LifeDrawings_button.PNG" alt="Life Drawings"></a></li>
                <li><a href="#"><img src="images/Experience_button.PNG" alt="Experience"></a></li>
                <li><a href="#"><img src="images/Contact_button.PNG" alt="Contact"></a></li>
            </ul>
            <!-- Mobile dropdown menu (shown when burger is clicked) -->
            <div id="mobile-dropdown">
                <ul>
                    <li><a href="#"><img src="images/home_button.PNG" alt="Home"></a></li>
                    <li><a href="#"><img src="images/MyFilms_button.PNG" alt="My Films"></a></li>
                    <li><a href="#"><img src="images/Portfolio_button.PNG" alt="Portfolio"></a></li>
                    <li><a href="#"><img src="images/LifeDrawings_button.PNG" alt="Life Drawings"></a></li>
                    <li><a href="#"><img src="images/Experience_button.PNG" alt="Experience"></a></li>
                    <li><a href="#"><img src="images/Contact_button.PNG" alt="Contact"></a></li>
                </ul>
            </div>
        </nav>
    </div>
    
    <div id="flex">
        <!-- Main body -->
        <main>
            <h1>Evgenia Shastina</h1>
            <h2>Animation Showreel</h2>
            
            <!-- Video Container -->
            <div class="video-container">
                <iframe 
                    src="https://www.youtube-nocookie.com/embed/Uxsc5-4vQyE?si=sQcTFtBdv7Q4F2e9" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    referrerpolicy="strict-origin-when-cross-origin" 
                    allowfullscreen>
                </iframe>
            </div>
            
            <!-- Video Info / Direct Link -->
            <div class="video-info">
                <p>If the video player doesn't display correctly, you can watch it directly here: 
                    <br>
                    <a href="https://youtu.be/Uxsc5-4vQyE?si=O2xMfCVcUNZhagKD" target="_blank" rel="noopener noreferrer">Watch on YouTube →</a>
                </p>
            </div>
            <!-- Extra info container below video -->
            <div id="sidebar">
                <h2>Hi there!</h2>
                <p>Welcome to my portfolio. Feel free to browse around!</p>
            </div>
        </main>
    </div>
    <footer id="footer">CC0 Public Domain, 2022</footer>
</div>
<!-- JavaScript -->
<script>
    /* Header blur on scroll */
    window.addEventListener('scroll', function() {
        const scrollY = window.scrollY;
        const header = document.getElementById('header');
        const blurValue = Math.min(scrollY / 25, 10);
        const scaleValue = 1 + (blurValue / 200);
        header.style.setProperty('--blur-amount', blurValue + 'px');
        header.style.setProperty('--scale-amount', scaleValue);
    });
    /* Burger menu toggle */
    const burgerBtn = document.getElementById('burger-btn');
    const mobileDropdown = document.getElementById('mobile-dropdown');
    burgerBtn.addEventListener('click', function() {
        burgerBtn.classList.toggle('open');
        mobileDropdown.classList.toggle('open');
    });
    /* Close dropdown when any link inside it is clicked */
    mobileDropdown.querySelectorAll('a').forEach(function(link) {
        link.addEventListener('click', function() {
            burgerBtn.classList.remove('open');
            mobileDropdown.classList.remove('open');
        });
    });
</script>
<!-- THIS IS THE CSS -->
<style>
    :root {
        --header-image: url('images/header.PNG');
        --body-bg-image: url('https://sadhost.neocities.org/images/tiles/purplesky.gif');
        --content: #43256E;
    }
    @font-face {
        font-family: Nunito;
        src: url('https://sadhost.neocities.org/fonts/Nunito-Regular.ttf');
    }
    @font-face {
        font-family: Nunito;
        src: url('https://sadhost.neocities.org/fonts/Nunito-Bold.ttf');
        font-weight: bold;
    }
    @font-face {
        font-family: Nunito;
        src: url('https://sadhost.neocities.org/fonts/Nunito-Italic.ttf');
        font-style: italic;
    }
    @font-face {
        font-family: Nunito;
        src: url('https://sadhost.neocities.org/fonts/Nunito-BoldItalic.ttf');
        font-style: italic;
        font-weight: bold;
    }
    body {
        font-family: 'Nunito', sans-serif;
        margin: 0;
        background-color: #f7f5ff;
        background-size: 65px;
        color: #fceaff;
        background-image: var(--body-bg-image);
    }
    * {
        box-sizing: border-box;
    }
    #container {
        width: 100%;
        margin: 0;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }
    #container a {
        color: #fee7ff;
        font-weight: bold;
    }
    /* Fixed header behind all content */
    #header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 250px;
        z-index: 1;
        overflow: hidden;
    }
    #header::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: #ffffff;
        background-image: var(--header-image);
        background-size: cover;
        background-position: center;
        z-index: -1;
        filter: blur(var(--blur-amount, 0px));
        transform: scale(var(--scale-amount, 1));
        will-change: filter, transform;
    }
    /* Sticky navbar area */
    #headerArea {
        position: sticky;
        top: 0;
        z-index: 1000;
        margin-top: 250px;
    }
    /* Navbar container */
    #navbar {
        height: 50px;
        background-color: #ffffff;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }
    /* Desktop: burger button hidden */
    #burger-btn {
        display: none;
    }
    /* Desktop: mobile dropdown hidden */
    #mobile-dropdown {
        display: none;
    }
    /* Desktop nav list: horizontal row */
    #nav-menu {
        display: flex;
        padding: 0;
        margin: 0;
        list-style-type: none;
        justify-content: space-evenly;
        align-items: center;
        width: 100%;
        height: 100%;
    }
    #nav-menu li {
        padding-top: 0;
    }
    #nav-menu li a {
        color: #ffffff;
        font-weight: 800;
        text-decoration: none;
    }
    #nav-menu li a:hover {
        text-decoration: underline;
    }
    #nav-menu li a img {
        display: block;
        border: none;
        max-height: 32px;
        transition: transform 0.2s ease;
    }
    #nav-menu li a img:hover {
        transform: scale(1.08);
    }
    /* Main content flex wrapper */
    #flex {
        display: flex;
        position: relative;
        z-index: 2;
        flex: 1;
    }
    main {
        background-color: #ffffff;
        flex: 1;
        padding: 40px 20px;
        order: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }
    footer {
        position: relative;
        z-index: 2;
        background-color: #ffffff;
        width: 100%;
        height: 40px;
        padding: 10px;
        text-align: center;
        color: #13092D;
    }
    h1, h2, h3 {
        color: #ED64F5;
    }
    h1 { font-size: 25px; }
    strong { color: #fff8ff; }
    .box {
        background-color: #13092D;
        border: 1px solid #ED64F5;
        padding: 10px;
    }
    .video-container {
        position: relative;
        width: 95%;
        max-width: 1000px;
        aspect-ratio: 16 / 9;
        margin: 20px auto;
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid #ED64F5;
        box-shadow: 0 8px 30px rgba(237, 100, 245, 0.45);
        background-color: #000;
    }
    .video-container iframe {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
    }
    .video-info {
        background-color: #13092D;
        border: 1px solid #ED64F5;
        padding: 15px;
        border-radius: 6px;
        margin-top: 15px;
        font-size: 0.9em;
        line-height: 1.6;
        width: 95%;
        max-width: 1000px;
    }
    .video-info a {
        display: inline-block;
        margin-top: 5px;
    }
    /* Extra info box below the video */
    #sidebar {
        width: 95%;
        max-width: 1000px;
        margin-top: 30px;
        padding: 20px;
        background-color: #241445;
        border-radius: 8px;
        text-align: left;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        font-size: smaller;
    }
    #sidebar h2 {
        margin-top: 0;
    }
    /* ============================================================ */
    /* MOBILE ONLY - Everything below applies to phones only        */
    /* ============================================================ */
    @media only screen and (max-width: 800px) {
        /* Smaller header on phones */
        #header {
            height: 150px;
        }
        #headerArea {
            margin-top: 150px;
        }
        /* Navbar: align burger to the right */
        #navbar {
            height: 50px;
            justify-content: flex-end;
            padding: 0 15px;
        }
        /* Hide desktop nav links on mobile */
        #nav-menu {
            display: none;
        }
        /* Show and style the burger button */
        #burger-btn {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 28px;
            height: 20px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 1100;
        }
        /* The three burger lines */
        #burger-btn span {
            display: block;
            width: 100%;
            height: 3px;
            background-color: #ED64F5;
            border-radius: 3px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        /* Burger animates into an X when open */
        #burger-btn.open span:nth-child(1) {
            transform: translateY(8.5px) rotate(45deg);
        }
        #burger-btn.open span:nth-child(2) {
            opacity: 0;
        }
        #burger-btn.open span:nth-child(3) {
            transform: translateY(-8.5px) rotate(-45deg);
        }
        /* Dropdown panel: slides down from navbar */
        #mobile-dropdown {
            display: block;
            position: absolute;
            top: 50px;
            right: 0;
            width: 220px;
            background-color: rgba(19, 9, 45, 0.97);
            border-left: 2px solid #ED64F5;
            border-bottom: 2px solid #ED64F5;
            border-radius: 0 0 0 10px;
            z-index: 1050;
            /* Collapsed by default */
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, padding 0.35s ease;
        }
        /* Expanded when .open class is added by JavaScript */
        #mobile-dropdown.open {
            max-height: 500px;
            padding: 10px 0;
        }
        /* Dropdown list */
        #mobile-dropdown ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        #mobile-dropdown li {
            width: 80%;
            display: flex;
            justify-content: center;
        }
        #mobile-dropdown li a img {
            max-width: 100%;
            max-height: 30px;
            height: auto;
            margin: 0 auto;
            transition: transform 0.2s ease;
        }
        #mobile-dropdown li a img:hover {
            transform: scale(1.08);
        }
        /* Stack layout vertically */
        #flex {
            flex-direction: column;
        }
        main {
            padding: 20px 10px;
        }
        .video-container {
            width: 100%;
            border-radius: 8px;
        }
        .video-info {
            width: 100%;
        }
        #sidebar {
            width: 100%;
        }
        footer {
            margin-top: auto;
        }
    }
</style>
</body>
</html>
