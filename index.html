<!-- JavaScript to dynamically blur the background image as you scroll -->
<script>
    window.addEventListener('scroll', function() {
        const scrollY = window.scrollY;
        const header = document.getElementById('header');
        
        // Calculates blur (max 10px blur when scrolled 250px)
        const blurValue = Math.min(scrollY / 25, 10);
        // Scales the image slightly to prevent ugly white edges from the blur
        const scaleValue = 1 + (blurValue / 200); 
        // Set the CSS variables dynamically
        header.style.setProperty('--blur-amount', blurValue + 'px');
        header.style.setProperty('--scale-amount', scaleValue);
    });
</script>

  label::after, label::before, label span {

    width: 100%;
    height: 3px;

  #burger-toggle:checked ~ label::after {
    transform: rotate(45deg);
    bottom: 10px;
  }

  #burger-toggle:checked ~ label::before {
    transform: rotate(-45deg);
    top: 12px;
  }

  #burger-toggle:checked ~ label span {
    transform: rotate(-45deg);
    top: 12px;
  }
