<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio – Evgenia Shastina</title>
    <style>
        @font-face {
        font-family: Footer;
        src: url('fonts/Bigbelow-gw60p.otf');
        font-weight: bold;
    }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        #container {
            display: flex;
            width: 100%;
            height: auto;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ======================== */
        /* NAVBAR                   */
        /* ======================== */
        #headerArea {
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        #navbar {
            height: 50px;
            background-color: #989aff;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Desktop: burger and dropdown hidden */
        #burger-btn {
            display: none;
        }

        #mobile-dropdown {
            display: none;
        }

        #nav-menu {
            display: flex;
            list-style: none;
            justify-content: space-evenly;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        #nav-menu li a img {
            display: block;
            max-height: 32px;
            border: none;
            transition: transform 0.2s ease;
        }

        #nav-menu li a img:hover {
            transform: scale(1.08);
        }

        /* ======================== */
        /* MAIN CONTENT            */
        /* ======================== */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #989aff;
        }

        #img-responsive {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 40px 0;
        }

        #img-responsive img {
            max-width: 50%;
            height: auto;
            object-fit: fill;
        }

        /* ======================== */
        /* CONTACT LIST STYLING    */
        /* ======================== */
        #body {
            display: flex;
            flex-direction: column;
            gap: 30px;
            padding: 0;
            list-style: none;
            width: 100%;
            max-width: 600px;
            margin: 0 auto 40px auto;
        }

        #body li {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background-color: #f0eae1;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        #body li:hover {
            background-color: #f0f0f0;
            transform: translateX(10px);
        }

        #body li a {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        #body li a img {
            width: 100%;
            height: auto;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        #body li a img:hover {
            transform: scale(1.1);
        }

        #body li p {
            src: url('fonts/MarseilleFreeRegular-rvKW8.otf');
            font-size: 20px;
            color: #c02323;
            margin: 0;
            transition: color 0.2s ease;
        }

        #body li:hover p {
            color: #ff9956;
        }

        .flower-img-bottom {
            position: absolute;
             z-index: 0;
             bottom: 0;
             right: 0;
             margin-top: auto;
             margin-left: auto;
             width: auto;
             max-width: 48%; 
            {
    pointer-events: none;
}
            }
            .flower-img-bottom-left {
            position: absolute;
            transform: scaleX(-1);
             z-index: 0;
             bottom: 0;
             left: 0;
             margin-top: auto;
             margin-left: auto;
             width: auto;
             max-width: 48%; 
                {
    pointer-events: none;
}
            }

        /* ======================== */
        /* FOOTER                  */
        /* ======================== */
        #footer {
            font-family: 'Footer';
            background-color: #989aff;
            width: 100%;
            height: 40px;
            padding: 10px;
            text-align: center;
            color: #ffd7b0;
            margin-top: auto;
        }

        /* ============================================= */
        /* MOBILE ONLY                                   */
        /* ============================================= */
        @media only screen and (max-width: 800px) {
            /* Navbar: burger on the right */
            #navbar {
                justify-content: flex-end;
                padding: 0 15px;
            }

            /* Hide desktop links on mobile */
            #nav-menu {
                display: none;
            }

            /* Show burger button */
            #burger-btn {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                width: 28px;
                height: 20px;
                background: none;
                border: none;
                cursor: pointer;
                padding: 0;
                z-index: 1100;
            }

            #burger-btn span {
                display: block;
                width: 100%;
                height: 3px;
                background-color: #ff9956;
                border-radius: 3px;
                transition: transform 0.3s ease, opacity 0.3s ease;
            }

            #burger-btn.open span:nth-child(1) {
                transform: translateY(8.5px) rotate(45deg);
            }

            #burger-btn.open span:nth-child(2) {
                opacity: 0;
            }

            #burger-btn.open span:nth-child(3) {
                transform: translateY(-8.5px) rotate(-45deg);
            }

            /* Mobile dropdown */
            #mobile-dropdown {
                display: block;
                position: absolute;
                top: 50px;
                right: 0;
                width: 220px;
                background-color: rgba(255, 255, 255, 0.97);
                z-index: 1050;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.35s ease, padding 0.35s ease;
            }

            #mobile-dropdown.open {
                max-height: 500px;
                padding: 10px 0;
            }

            #mobile-dropdown ul {
                list-style: none;
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }

            #mobile-dropdown li {
                width: 80%;
                display: flex;
                justify-content: center;
            }

            #mobile-dropdown li a img {
                max-width: 100%;
                max-height: 30px;
                height: auto;
                margin: 0 auto;
            }

            #img-responsive img {
                max-width: 90%;
                height: auto;
            }

            #body {
                max-width: 85%;
                gap: 20px;
                padding: 0 15px;
            }

            #body li {
                padding: 15px;
                gap: 15px;
                flex-direction: column;
                text-align: center;
            }

            #body li a img {
                width: 100%;
                height: auto;
            }

            #body li p {
                font-size: 20px;
            }
            .flower-img-bottom {
            display: none;
            }
            .flower-img-bottom-left {
            position: absolute;
            transform: scaleX(-1);
             z-index: 0;
             top: -5;
             margin-bottom: auto;
             left: 0;
             margin-right: auto;
             width: auto;
             max-width: 100%;
                {
    pointer-events: none;
}
            }
            html,
body {
    width: 100%;
    overflow-x: hidden;
    background: #989aff;
}
footer {
            margin-top: auto;
        }
            
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- NAVBAR -->
        <div id="headerArea">
            <nav id="navbar">
                <!-- Burger button (mobile only) -->
                <button id="burger-btn" aria-label="Open menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <!-- Desktop nav links -->
                <ul id="nav-menu">
                    <li><a href="index.html"><img src="images/home_button.PNG"
                        onmouseover="this.src='images/Home.GIF'" 
                        onmouseout="this.src='images/home_button.PNG'" 
                        alt="Home"></a></li>
                    <li><a href="myFilms.html"><img src="images/MyFilms_button.PNG"
                        onmouseover="this.src='images/MyFilms.GIF'" 
                        onmouseout="this.src='images/MyFilms_button.PNG'" 
                        alt="My Films"></a></li>
                    <li><a href="portfolio.html"><img src="images/Portfolio_button.PNG"
                        onmouseover="this.src='images/Portfolio.GIF'" 
                        onmouseout="this.src='images/Portfolio_button.PNG'" 
                        alt="Portfolio"></a></li>
                    <li><a href="lifeDrawings.html"><img src="images/LifeDrawings_button.PNG" 
                        onmouseover="this.src='images/LifeDrawings.GIF'" 
                        onmouseout="this.src='images/LifeDrawings_button.PNG'" 
                        alt="Life Drawings"></a></li>
                    <li><a href="experience.html"><img src="images/Experience_button.PNG" 
                        onmouseover="this.src='images/Experience.GIF'" 
                        onmouseout="this.src='images/Experience_button.PNG'" 
                        alt="Experience"></a></li>
                    <li><a href="contact.html"><img src="images/Contact_button.PNG"
                        onmouseover="this.src='images/Contact.GIF'" 
                        onmouseout="this.src='images/Contact_button.PNG'" 
                        alt="Contact"></a></li>
                </ul>

                <!-- Mobile dropdown -->
                <div id="mobile-dropdown">
                    <ul>
                        <li><a href="index.html"><img src="images/home_button.PNG" alt="Home"></a></li>
                        <li><a href="myFilms.html"><img src="images/MyFilms_button.PNG" alt="My Films"></a></li>
                        <li><a href="portfolio.html"><img src="images/Portfolio_button.PNG" alt="Portfolio"></a></li>
                        <li><a href="lifeDrawings.html"><img src="images/LifeDrawings_button.PNG" alt="Life Drawings"></a></li>
                        <li><a href="experience.html"><img src="images/Experience_button.PNG" alt="Experience"></a></li>
                        <li><a href="contact.html"><img src="images/Contact_button.PNG" alt="Contact"></a></li>
                    </ul>
                </div>
            </nav>
        </div>

        <!-- MAIN CONTENT -->
        <main>
            <!-- Contact Title -->
            <div id="img-responsive">
                <img src="images/ContactMeYellow.gif" alt="contact-me">
            </div>

            <!-- Contact List -->
            <ul id="body">
                <li>
                    <a href="mailto:evgenia.shastina@gmail.com">
                        <img src="images/emaillogo.png" alt="Email">
                    </a>
                    <p>evgenia.shastina@gmail.com</p>
                </li>

                <li>
                    <a href="https://www.instagram.com/shastina.mov/">
                        <img src="images/instalogo.png" alt="Instagram">
                    </a>
                    <p>@shastina.mov</p>
                </li>

                <li>
                    <a href="https://x.com/shastina_mov?s=20">
                        <img src="images/twitterlogo (1).png" alt="Twitter">
                    </a>
                    <p>@shastina_mov</p>
                </li>
            </ul>
            <img class="flower-img-bottom-left" 
            src="images/Flower_corner.png" >
            <img class="flower-img-bottom" 
            src="images/Flower_corner.png" >
            
        </main>

        </div>
    <footer id="footer">Evgenia Shastina, All Rights Reserved, 2026</footer>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        /* Burger menu toggle */
        const burgerBtn = document.getElementById('burger-btn');
        const mobileDropdown = document.getElementById('mobile-dropdown');
        
        burgerBtn.addEventListener('click', function() {
            burgerBtn.classList.toggle('open');
            mobileDropdown.classList.toggle('open');
        });

        mobileDropdown.querySelectorAll('a').forEach(function(link) {
            link.addEventListener('click', function() {
                burgerBtn.classList.remove('open');
                mobileDropdown.classList.remove('open');
            });
        });
    </script>
</body>
</html>
